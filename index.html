<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Introduction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            color: #333;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }

        h1 {
            font-weight: 700;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-weight: 300;
            font-size: 1.2rem;
            margin-top: 0;
        }

        .greeting {
            color: #2d2d2d;
        }

        .name {
            font-weight: 600;
            color: #007BFF;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1 class="greeting">Hey there, welcome!</h1>
        <p>I'm <span class="name">John</span>, and it's a pleasure to meet you. I’m always excited to connect and share ideas—whether it’s about creativity, life, or just a good conversation.</p>
    </div>
</body>
</html>
